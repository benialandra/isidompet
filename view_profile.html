
      <!-- ==================== PROFILE VIEW ==================== -->
      <div id="view-profile" class="hidden fade-up max-w-md mx-auto pt-10">
        <div
          class="bg-white dark:bg-darkcard rounded-3xl shadow-lg border border-slate-100 dark:border-slate-700 overflow-hidden bounce-card">
          <div class="p-8 border-b dark:border-slate-700 text-center">
            <div
              class="w-20 h-20 bg-indigo-100 dark:bg-indigo-900/50 rounded-full flex items-center justify-center mx-auto mb-4 text-primary text-3xl">
              <i class="fa-solid fa-user-shield text-indigo-500"></i>
            </div>
            <h2 class="font-bold text-xl dark:text-white" data-i18n="change_password">Ganti Password</h2>
          </div>
          <form onsubmit="submitChangePassword(event)" class="p-8 space-y-5">
            <div>
              <label class="text-xs font-bold text-slate-400 uppercase" data-i18n="old_password">Password Lama</label><input type="password" id="old-pass" data-i18n-ph="ph_old_pass" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-primary mt-1 text-start placeholder-slate-300 dark:placeholder-slate-600 transition-all" required>
            </div>
            <div>
              <label class="text-xs font-bold text-slate-400 uppercase" data-i18n="new_password">Password Baru</label><input type="password" id="new-pass" data-i18n-ph="ph_new_pass" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-primary mt-1 text-start placeholder-slate-300 dark:placeholder-slate-600 transition-all" required>
            </div>
            <div>
              <label class="text-xs font-bold text-slate-400 uppercase" data-i18n="confirm_password">Konfirmasi</label><input type="password" id="confirm-pass" data-i18n-ph="ph_confirm_pass" class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-primary mt-1 text-start placeholder-slate-300 dark:placeholder-slate-600 transition-all" required>
            </div>
            <button type="submit" id="btn-change-pass" class="w-full bg-primary hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-lg transform active:scale-95 transition-transform mt-4 flex justify-center items-center gap-2"><i class="fa-solid fa-floppy-disk text-white"></i> <span data-i18n="btn_save">Simpan</span></button>
          </form>
        </div>
      </div>
