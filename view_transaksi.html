<!-- ==================== TRANSAKSI VIEW ==================== -->
<div id="view-transaksi" class="hidden fade-up max-w-2xl mx-auto pb-10">
  <div
    class="bg-white dark:bg-darkcard rounded-3xl shadow-lg border border-slate-100 dark:border-slate-700 overflow-hidden bounce-card">
    <div class="p-6 bg-slate-50 dark:bg-slate-800/50 border-b dark:border-slate-700">
      <h2 class="font-bold text-lg flex items-center gap-2">
        <i class="fa-solid fa-money-bill-transfer text-emerald-500"></i>
        <span data-i18n="input_trx">Input Transaksi</span>
      </h2>
    </div>
    <form id="form-transaksi" onsubmit="submitTransaksi(event)" class="p-6 space-y-6">
      <div class="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl gap-1">
        <button type="button" onclick="setJenis('Masuk')" id="btn-masuk"
          class="flex-1 py-3 rounded-lg font-bold text-sm text-slate-500 transition-colors"
          data-i18n="btn_income">Masuk</button>
        <button type="button" onclick="setJenis('Keluar')" id="btn-keluar"
          class="flex-1 py-3 rounded-lg font-bold text-sm text-slate-500 transition-colors"
          data-i18n="btn_expense">Keluar</button>
        <button type="button" onclick="setJenis('Transfer')" id="btn-transfer"
          class="flex-1 py-3 rounded-lg font-bold text-sm text-slate-500 transition-colors"
          data-i18n="btn_transfer">Transfer</button>
        <input type="hidden" name="t_jenis" id="t_jenis" value="Keluar">
      </div>

      <div class="relative">
        <span class="absolute start-4 top-4 text-slate-400 font-bold text-lg curr-indicator">IDR</span>
        <input type="text" name="t_nominal" id="t_nominal" data-i18n-ph="ph_amount" onkeyup="formatCurrency(this)"
          class="w-full text-3xl font-bold ps-14 pe-4 py-3 border-b-2 border-slate-200 dark:border-slate-600 bg-transparent outline-none focus:border-primary transition-colors text-start placeholder-slate-300 dark:placeholder-slate-600"
          dir="ltr" placeholder="0" required>
      </div>
      <p id="error-saldo" class="text-red-500 text-xs font-bold hidden animate-pulse">
        <i class="fa-solid fa-triangle-exclamation text-red-500"></i>
        <span id="error-saldo-text">Saldo tidak cukup!</span>
      </p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase" data-i18n="table_date">Tanggal</label><input
            type="date" name="t_tanggal" id="t_tanggal"
            class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-primary text-start transition-all"
            required>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-400 uppercase" id="label-sumber" data-i18n="from_account">Dari
            Akun</label><select name="t_sumber" id="t_sumber" onchange="validateBalance()"
            class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-primary transition-all"
            required>
            <option>Loading...</option>
          </select>
        </div>
      </div>
      <div id="div-tujuan" class="hidden">
        <label class="text-xs font-bold text-blue-500 uppercase" data-i18n="to_account">Ke Akun</label><select
          name="t_tujuan_transfer" id="t_tujuan"
          class="w-full p-3 bg-blue-50 dark:bg-slate-900 border border-blue-200 dark:border-blue-700 rounded-xl outline-none font-bold text-blue-800 dark:text-blue-100 focus:ring-2 focus:ring-blue-500 transition-all">
          <option>Loading...</option>
        </select>
      </div>
      <div id="div-kategori">
        <label class="text-xs font-bold text-slate-400 uppercase" data-i18n="table_category">Kategori</label><select
          name="t_kategori"
          class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:ring-2 focus:ring-primary transition-all"></select>
      </div>
      <div id="div-keterangan-container">
        <label class="text-xs font-bold text-slate-400 uppercase" data-i18n="table_desc">Keterangan</label>
        <input type="text" id="input-keterangan-text" name="t_keterangan" data-i18n-ph="desc_placeholder"
          class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none uppercase-input focus:ring-2 focus:ring-primary transition-all placeholder-slate-300 dark:placeholder-slate-600"
          required>
        <select id="input-keterangan-select"
          class="hidden w-full p-3 bg-indigo-50 dark:bg-indigo-900/30 border border-indigo-200 dark:border-indigo-700 rounded-xl outline-none font-bold text-indigo-800 dark:text-indigo-300 mb-2 focus:ring-2 focus:ring-indigo-500 transition-all">
          <option>Loading...</option>
        </select>
        <input type="text" id="input-keterangan-manual" data-i18n-ph="desc_placeholder" name="t_manual"
          class="hidden w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl outline-none uppercase-input focus:ring-2 focus:ring-primary mt-2 transition-all placeholder-slate-300 dark:placeholder-slate-600">
      </div>
      <button type="submit" id="btn-save-trx"
        class="w-full bg-slate-800 hover:bg-slate-900 dark:bg-primary dark:hover:bg-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg transform active:scale-95 transition-transform disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center justify-center gap-2"><i
          class="fa-solid fa-save text-white"></i> <span data-i18n="btn_save_trx">Simpan Transaksi</span></button>
    </form>
  </div>
</div>
